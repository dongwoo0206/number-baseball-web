<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚾ 숫자 야구 게임</title>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="main-container">
        <!-- 기존 게임 보드 -->
        <div class="game-board" id="gameBoard">
            <h1>⚾ 숫자 야구</h1>
            <p class="desc">0~9 사이의 중복 없는 3자리 숫자를 맞춰보세요!</p>
            <div class="input-group">
                <input type="text" id="guessInput" maxlength="3" onkeypress="handleEnter(event)">
                <button onclick="sendGuess()">던지기</button>
            </div>
            <div class="log-container" id="log"></div>
        </div>

        <!-- 🏆 새로운 랭킹 보드 -->
        <div class="leaderboard-container">
            <h2>🏆 명예의 전당 (Top 5)</h2>
            <ul id="rankingList"></ul>
        </div>
    </div>

    <script>
        // 페이지 열릴 때 랭킹 불러오기
        window.onload = fetchLeaderboard;

        async function fetchLeaderboard() {
            const res = await fetch('/get_leaderboard');
            const data = await res.json();
            const list = document.getElementById('rankingList');
            list.innerHTML = "";
            data.forEach((rank, idx) => {
                list.innerHTML += `<li>${idx + 1}위: <strong>${rank.name}</strong> <span>${rank.attempts}번</span></li>`;
            });
        }

        function triggerShake() {
            const board = document.getElementById('gameBoard');
            board.classList.remove('shake');
            void board.offsetWidth; 
            board.classList.add('shake');
        }

        function handleEnter(e) { if (e.key === 'Enter') sendGuess(); }

        async function sendGuess() {
            const inputVal = document.getElementById('guessInput').value;
            if (inputVal.length !== 3 || new Set(inputVal).size !== 3 || isNaN(inputVal)) {
                alert("중복 없는 3자리 숫자를 입력하세요!"); return;
            }

            const response = await fetch('/guess', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ guess: inputVal })
            });
            const data = await response.json();

            let resultHTML = "";
            if (data.is_homerun) {
                resultHTML = `<span class="badge homerun">🎉 ${data.attempts}번 만에 홈런!</span>`;
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                
                // 랭킹 등록 기능 추가
                setTimeout(async () => { 
                    const playerName = prompt(`🎉 ${data.attempts}번 만에 정답!\n랭킹에 등록할 이름을 입력하세요 (취소 시 미등록)`);
                    if (playerName) {
                        await fetch('/save_score', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: playerName.slice(0, 10), attempts: data.attempts })
                        });
                        fetchLeaderboard(); // 랭킹 새로고침
                    }
                    document.getElementById('log').innerHTML = ""; 
                }, 1500);
            } else if (data.strikes === 0 && data.balls === 0) {
                resultHTML = `<span class="badge out">OUT</span>`;
                triggerShake();
            } else {
                if (data.strikes > 0) resultHTML += `<span class="badge strike">${data.strikes}S</span>`;
                if (data.balls > 0) resultHTML += `<span class="badge ball">${data.balls}B</span>`;
            }

            const logDiv = document.getElementById('log');
            const newLog = document.createElement('div');
            newLog.className = 'log-item';
            newLog.innerHTML = `<span class="guess-number">${inputVal}</span> <div>${resultHTML}</div>`;
            logDiv.insertBefore(newLog, logDiv.firstChild);
            
            document.getElementById('guessInput').value = "";
            document.getElementById('guessInput').focus();
        }
    </script>
</body>
</html>
